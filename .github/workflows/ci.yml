# ============================================================================
# RunBeat 代码自检（CI）
# ============================================================================
# 作用：每次推送代码，让 GitHub 的机器替你把三个检查跑一遍。
#     任何一项不过，这条流水线就标红，你会立刻知道"这次的改动把什么弄坏了"。
#
# 和 release.yml 的分工：
#   ci.yml      —— 每次改代码都跑，只检查、不发布（约 2~3 分钟）
#   release.yml —— 只有打 tag 才跑，检查完还要打包发版（约 2.5 分钟）
# 两个文件互不影响，删掉这个也不影响发版。
#
# 本地想先跑一遍（不用推代码）：
#   .venv\Scripts\python.exe scripts\check_frontend.py
#   .venv\Scripts\python.exe scripts\selftest.py
#   node --check static\app.js
# ============================================================================

name: 代码自检

# ---------------------------------------------------------------------------
# on：什么时候自动开跑
# ---------------------------------------------------------------------------
on:
  push:              # 任何分支的推送（后面空着 = 不限制分支）
  pull_request:      # 有人提 PR 时
  workflow_dispatch: # 也可以在 Actions 页面手动点按钮跑一次

# ---------------------------------------------------------------------------
# permissions：给它多大权限
# ---------------------------------------------------------------------------
# 只读就够了 —— 这条流水线只看代码，不改仓库、不发版。
# 权限给得越小越安全，GitHub 官方推荐这么写。
permissions:
  contents: read

# ---------------------------------------------------------------------------
# concurrency：同一分支同时只跑一个
# ---------------------------------------------------------------------------
# 场景：你连着推了两次代码，第一次还没跑完。
# cancel-in-progress: true 会砍掉上一次、只留最新的 —— 省时间也省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# jobs：派谁去干
# ---------------------------------------------------------------------------
jobs:
  check:
    runs-on: ubuntu-latest   # Linux 机器，比 Windows 快，且不按 2 倍计费

    steps:
      # ---- 1. 拉代码 -------------------------------------------------------
      # 机器是全新的空机器，第一步永远是把仓库代码下载下来。
      - uses: actions/checkout@v4

      # ---- 2. JS 语法检查（最快，所以放最前）-------------------------------
      # 机器自带 Node.js，不用额外安装。
      # --check 只解析不执行，能抓住括号不配对、引号写错这类低级错误。
      # 放在装依赖之前：万一 JS 写崩了，10 秒内就能知道，不用等 3 分钟。
      - name: JS 语法检查
        run: node --check static/app.js

      # ---- 3. 装 Python ----------------------------------------------------
      # cache: pip 会把 pip 下载过的包存起来，下次直接复用。
      # 判断依据是 requirements.txt 的哈希 —— 依赖没变就不重新下载。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # ---- 4. 前端静态校验 -------------------------------------------------
      # 纯标准库脚本，不需要装任何依赖，所以放在 pip install 之前。
      # 它检查：JS 引用的 id 是否都存在、id 有没有重复、CSS 花括号是否配对、
      #        HTML 标签是否闭合。20 秒内出结果。
      - name: 前端静态校验
        run: python scripts/check_frontend.py

      # ---- 5. 装依赖（最慢，所以放最后）------------------------------------
      # pip install 是整条流水线最耗时的部分（librosa 要拉 numpy/scipy/numba 等）。
      # 前面几步都通过之后再装，能省下大量白白等待的时间。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- 6. 后端算法自检 -------------------------------------------------
      # 合成几段测试音频，跑一遍 BPM 检测、倍率换算、时间伸缩、ffmpeg 导出。
      # 最慢的一步（2~3 分钟），因为 librosa 首次导入要编译 numba 缓存。
      - name: 后端算法自检
        run: python scripts/selftest.py


